name: MagMusic
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MAKit:
    path: MAKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MA_APP_GROUP: $(TeamIdentifierPrefix)magmusic
    MA_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).magmusic.shared
targets:
  MagMusic:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: MAKit
      - target: MagMusicWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).magmusic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MagMusic
        LSApplicationCategoryType: public.app-category.music
        MAAppGroup: $(MA_APP_GROUP)
        MAKeychainGroup: $(MA_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: MagMusic talks to your Music Assistant server on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/MagMusic.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(MA_APP_GROUP)]
        keychain-access-groups: [$(MA_KEYCHAIN_GROUP)]
  MagMusicWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    dependencies:
      - package: MAKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).magmusic.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MagMusic
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MAAppGroup: $(MA_APP_GROUP)
        MAKeychainGroup: $(MA_KEYCHAIN_GROUP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widget/MagMusicWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(MA_APP_GROUP)]
        keychain-access-groups: [$(MA_KEYCHAIN_GROUP)]
